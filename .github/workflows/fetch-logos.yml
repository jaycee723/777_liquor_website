name: Fetch brand logos

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/fetch-logos.yml

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/fetch_logos.py scripts/brand_list.csv
      - name: Commit logos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 777-Liquor-Website/website/public/images/brands attribution.csv
          git diff --cached --quiet || git commit -m "Add brand logos (svg/png/jpg/webp) and update brands.json"
          git push
