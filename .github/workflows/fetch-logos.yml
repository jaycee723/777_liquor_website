name: Fetch brand logos

on:
  workflow_dispatch:
    inputs:
      category:
        description: Brand category to fetch
        type: choice
        default: all
        options: [all, Beer, RTD, Spirits, Wine]
      limit:
        description: Max brands to process (0 = all)
        default: "0"
      force:
        description: Re-download logos that already exist
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - scripts/brand_list.csv
      - scripts/fetch_logos.py
      - .github/workflows/fetch-logos.yml

concurrency:
  group: fetch-logos
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      - name: Fetch logos
        env:
          CATEGORY: ${{ inputs.category || 'all' }}
          LIMIT: ${{ inputs.limit || '0' }}
          FORCE: ${{ inputs.force && '--force' || '' }}
        run: python -u scripts/fetch_logos.py scripts/brand_list.csv --category "$CATEGORY" --limit "$LIMIT" $FORCE

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logo-fetch-reports
          path: reports/logo-fetch/
          if-no-files-found: ignore

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 777-Liquor-Website/website/public/images/brands reports/logo-fetch
          if git diff --cached --quiet; then echo "No changes to commit."; exit 0; fi
          git commit -m "chore: update brand logos and index"
          for i in 1 2 3 4 5; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "Push attempt $i failed, retrying..."; sleep $((i * 5))
          done
          echo "Could not push after 5 attempts." >&2; exit 1
